name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./build.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: StampSign-app
          path: StampSign.app
          if-no-files-found: error
