name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: ditto -c -k --keepParent StampSign.app "StampSign-${GITHUB_REF_NAME}.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "StampSign-${GITHUB_REF_NAME}.zip" --title "StampSign ${GITHUB_REF_NAME}" --generate-notes
